spring.application.name=pessoa

# Default: MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sistema_gestao?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# OpenAPI/Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Auth/JWT
app.jwt.secret=${JWT_SECRET:change-me-to-a-very-long-secret-please}
app.jwt.issuer=${JWT_ISSUER:sistemapedidos}
app.jwt.expires-in-seconds=${JWT_EXPIRES_IN_SECONDS:300}

# Usuario "admin" para autenticar e obter token.
# Obs: sem defaults para evitar credenciais conhecidas no build. Configure via variaveis de ambiente.
app.auth.username=${AUTH_USERNAME:}
app.auth.password=${AUTH_PASSWORD:}
# Alternativa mais segura para bootstrap: informar o hash (Argon2id) diretamente, sem senha em texto claro.
app.auth.password-hash=${AUTH_PASSWORD_HASH:}

# Bootstrap (criar usuario admin inicial no startup). Deixe false por padrao; habilite explicitamente quando precisar.
app.auth.bootstrap.enabled=${AUTH_BOOTSTRAP_ENABLED:false}
